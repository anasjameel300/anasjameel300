<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 240" width="100%" height="auto" fill="none">
  <defs>
    <style>
      @keyframes drawLine {
        0% { stroke-dashoffset: 2000; opacity: 0; }
        10% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes areaFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .flow-line {
        stroke-dasharray: 2000;
        stroke-dashoffset: 0;
        animation: drawLine 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .flow-area {
        animation: areaFade 1.4s ease-in-out forwards;
      }
    </style>
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

