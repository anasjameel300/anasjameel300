      <tspan fill="#ffffff" font-weight="600">666</tspan> Total Year  •  <tspan fill="#ffffff" font-weight="600">10</tspan> in 30D  •  Peak: <tspan fill="#ffffff" font-weight="600">4/day</tspan>
    </text>
    <line x1="0" y1="26" x2="842" y2="26" stroke="#21262d" stroke-width="1"/>
  </g>

