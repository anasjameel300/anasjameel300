        <rect x="0.0" y="0" width="187.1" height="10" rx="2" fill="#ffffff"/><rect x="187.1" y="0" width="129.7" height="10" rx="2" fill="#8b949e"/><rect x="316.9" y="0" width="50.4" height="10" rx="2" fill="#565e69"/><rect x="367.3" y="0" width="17.3" height="10" rx="2" fill="#30363d"/>
